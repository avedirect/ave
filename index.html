<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>HYLIOX — Templates that don't feel like AI made them</title>
    <meta
      name="description"
      content="8 premium templates, Cursor / v0 / Lovable ready. Ship a site that doesn't feel like AI made it."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      />
    </noscript>

    <!-- Critical above-the-fold CSS: paints the shell + loader before the
         main stylesheet or any JS arrives, so there is no flash and no CLS. -->
    <style>
      :root {
        color-scheme: dark;
        --obsidian: #0a0a0a;
        --lime: #d4ff4f;
        --ink: #fafafa;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--obsidian);
        color: var(--ink);
      }
      body {
        font-family: Geist, Inter, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow-x: hidden;
      }
      #root {
        min-height: 100svh;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--obsidian);
        z-index: 999;
      }
      #boot span {
        font-family: Geist, Inter, system-ui, sans-serif;
        font-weight: 500;
        font-size: 13px;
        letter-spacing: 0.4em;
        color: rgba(250, 250, 250, 0.24);
        text-indent: 0.4em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the React loading screen on hydration. -->
      <div id="boot"><span>HYLIOX</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
